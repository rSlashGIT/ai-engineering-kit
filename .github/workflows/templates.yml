---
name: Template Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python Template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /tmp/test-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: templates/python/pyproject.toml
      - name: Copy template and substitute placeholders
        working-directory: ${{ github.workspace }}
        run: |
          cp -r templates/python /tmp/test-python
          find /tmp/test-python -type f -exec sed -i \
            -e "s/__PROJECT_NAME__/ci-test-project/g" \
            -e "s/__PROJECT_DESCRIPTION__/CI test project/g" \
            {} +
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install project
        run: |
          source .venv/bin/activate
          pip install -e ".[dev]"
      - name: Run pytest
        run: |
          source .venv/bin/activate
          pytest
      - name: Run ruff check
        run: |
          source .venv/bin/activate
          ruff check
      - name: Run mypy
        run: |
          source .venv/bin/activate
          mypy --strict

  typescript:
    name: TypeScript Template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /tmp/test-typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/typescript/package.json
      - name: Copy template and substitute placeholders
        working-directory: ${{ github.workspace }}
        run: |
          cp -r templates/typescript /tmp/test-typescript
          find /tmp/test-typescript -type f -exec sed -i \
            -e "s/__PROJECT_NAME__/ci-test-project/g" \
            -e "s/__PROJECT_DESCRIPTION__/CI test project/g" \
            {} +
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
